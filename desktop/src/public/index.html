<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>局域网互传工具 · local-sharing</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
        <defs>
          <linearGradient id="ls-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3b6cff"/>
            <stop offset="1" stop-color="#5b7cff"/>
          </linearGradient>
        </defs>
        <rect width="40" height="40" rx="12" fill="url(#ls-g)"/>
        <path d="M12 16h13l-3-3 1.4-1.4L27.8 17l-4.4 4.4L22 20l3-3H12v-1zm16 8H15l3 3-1.4 1.4L12.2 23l4.4-4.4L18 20l-3 3h16v1z" fill="#fff"/>
      </svg>
      <div>
        <h1>local-sharing</h1>
        <p class="sub">局域网互传 · 电脑端</p>
      </div>
    </div>
    <div class="conn" id="connState"><span class="dot off"></span> 连接中…</div>
  </header>

  <section class="hero">
    <div class="qr"><img id="qr" alt="二维码" /></div>
    <div class="hero-info">
      <div class="overline">本机名称</div>
      <div class="display" id="devName">—</div>
      <div class="overline" style="margin-top:16px">连接方式</div>
      <div class="addr-row">
        <code class="addr" id="connectUrl">—</code>
        <button class="btn copy sm" id="copyBtn">📋 复制</button>
      </div>
      <p class="hint">手机扫码，或输入地址即可连接</p>
    </div>
  </section>

  <main class="grid">
    <section class="card">
      <h2 class="card__title">已连接设备 <span class="badge" id="devCount">0</span></h2>
      <ul class="list" id="deviceList"></ul>
    </section>

    <section class="card">
      <h2 class="card__title">发送到设备</h2>
      <label class="field"><span>选择设备</span><select id="targetDevice"></select></label>
      <div class="drop" id="drop">
        把文件拖到这里，或
        <label class="btn primary sm">选择文件<input type="file" id="fileInput" multiple hidden /></label>
        <label class="btn secondary sm">选择文件夹<input type="file" id="folderInput" webkitdirectory multiple hidden /></label>
      </div>
      <ul class="list" id="pickList"></ul>
      <button class="btn primary" id="sendBtn" disabled>发送 →</button>
      <div class="log" id="sendLog"></div>
    </section>

    <section class="card" id="settingsCard">
      <h2 class="card__title">设置</h2>
      <label class="field">
        <span>文件保存目录</span>
        <div class="dir-row">
          <code class="dir-path" id="downloadDir">默认</code>
          <button class="btn secondary sm" id="changeDirBtn">选择文件夹</button>
        </div>
      </label>
    </section>

    <section class="card">
      <h2 class="card__title">传输记录
        <button class="btn ghost sm" id="clearReceivedBtn" title="清空收到的文件（同时删除磁盘文件）">清空收到</button>
        <button class="btn danger sm" id="clearBtn" title="清空全部历史（仅清记录，不删磁盘文件）">清空历史</button>
      </h2>
      <ul class="timeline" id="transferLog"></ul>
    </section>
  </main>

  <!-- 拖拽即发：未选设备时弹出的设备选择浮层 -->
  <div id="devicePicker" class="overlay hidden">
    <div class="overlay-card">
      <h3>选择发送设备</h3>
      <p class="overlay-hint">拖入的文件将发送到所选设备，并记住此选择以便下次拖拽即发。</p>
      <select id="pickerDevice"></select>
      <div class="overlay-actions">
        <button class="btn ghost sm" id="pickerCancel">取消</button>
        <button class="btn primary sm" id="pickerConfirm">发送</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
